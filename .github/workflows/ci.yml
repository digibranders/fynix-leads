# The checks that must pass before code reaches main or development.
#
# Two jobs. `checks` is lint, typecheck, test and build: they share one install, so splitting them would pay the
# install cost several times for no gain. `database` needs a Postgres service and is slower, so it runs beside
# `checks` instead of adding to it.
name: CI

on:
  # Every pull request, whatever it targets, so a PR stacked on another branch still gets checked.
  pull_request:
  # Pushes only to the shared branches. A feature branch is already covered by its pull request.
  push:
    branches: [main, development]

# A new push to the same branch makes the previous run irrelevant, so stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, which needs pnpm on PATH to resolve the store it caches.
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Known-vulnerable production dependencies at high severity or above fail the build. Moderate ones are reported, not blocking.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      # Includes the isolation test that fails if shared client code imports the sample data.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # CLAUDE.md copy rule: no em or en dashes in app text, source or design docs.
      - name: Copy rules (no em or en dashes)
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const bad = [];
            const scan = (f) => { if (/[–—]/.test(fs.readFileSync(f, "utf8"))) bad.push(f); };
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).forEach((e) => {
              const f = path.join(d, e.name);
              if (e.isDirectory()) walk(f);
              else if (/\.(tsx?|css|md)$/.test(f)) scan(f);
            });
            ["app", "components", "lib"].forEach(walk);
            ["DESIGN.md", "CLAUDE.md", "README.md"].forEach(scan);
            if (bad.length) { console.error("Dashes found in:\n" + bad.join("\n")); process.exit(1); }
            console.log("No em or en dashes.");
          '

  # Every migration on an empty database, then the integration tests. This is the check that the row-level security
  # and column-grant design holds on a real Postgres, so it must stay a separate job: `checks` needs no database.
  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Production runs Postgres 16. The superuser is named after the runner's OS user and local connections need no
    # password, because that is what `pnpm env:init` writes for the admin connection
    # (`postgresql://<os user>@localhost:5432/postgres`). The six application roles still log in as themselves, so
    # row-level security and column grants are exercised for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Throwaway secrets for this run only, written to the git-ignored .env.local the scripts read.
      - name: Generate the local environment
        run: pnpm env:init

      - name: Create the roles
        run: pnpm db:roles

      # fynix_leads and fynix_leads_test, owned by leads_owner, as on a new machine.
      - name: Create the databases
        run: pnpm db:create

      # Every migration, in order, on an empty database: the check this job exists for.
      - name: Migrate an empty database
        run: pnpm db:migrate

      # Migrates the empty test database the same way, then runs the integration suites against it.
      - name: Integration tests
        run: pnpm test:integration

      # Catches an edit to server/db/schema/*.ts with no migration. drizzle-kit writes a new migration and snapshot
      # when the schema differs from the last snapshot; any change under migrations/ then fails the job. Untracked
      # new files count too, because porcelain lists them.
      - name: Schema matches the migrations
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "The schema has changes with no migration. Run pnpm db:generate and commit the result:"
            git status --porcelain server/db/migrations
            exit 1
          fi
