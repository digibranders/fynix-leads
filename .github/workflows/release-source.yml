name: Release source

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  statuses: write

jobs:
  validate:
    name: Publish release source status
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This workflow runs from the base branch. It uses PR metadata without checking out PR code.
      - name: Validate source branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=failure
          description="Use this repository's development or steve branch."
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && ( "$HEAD_BRANCH" == development || "$HEAD_BRANCH" == steve ) ]]; then
            state=success
            description="The release source branch is allowed."
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="Release source" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
