version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Better Auth is pinned exactly on purpose: canary tests guard its quirks, so an upgrade is a deliberate change.
    ignore:
      - dependency-name: better-auth
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
